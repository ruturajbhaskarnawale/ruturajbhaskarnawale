    .prompt-user { fill: #58a6ff; font-weight: bold; }
    .prompt-at { fill: #8b949e; }
    .prompt-host { fill: #bc8cff; font-weight: bold; }
    .prompt-sep { fill: #8b949e; }
    .key { fill: #79c0ff; font-weight: 600; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .val { fill: #c9d1d9; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
    .separator { stroke: #30363d; stroke-width: 1px; }
    .animate-line { opacity: 0; animation: fadeInSlide 0.4s ease-out forwards; }
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

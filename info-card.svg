<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 530" width="490" height="530">
  <style>
    .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; }
    .title-bar { fill: #161b22; }
    .dot-red { fill: #ff5f56; }
    .dot-yellow { fill: #ffbd2e; }
    .dot-green { fill: #27c93f; }
    .title-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; fill: #8b949e; font-weight: 600; }
    .prompt-user { fill: #58a6ff; font-weight: bold; }
    .prompt-at { fill: #8b949e; }
    .prompt-host { fill: #bc8cff; font-weight: bold; }
    .prompt-sep { fill: #8b949e; }
    .key { fill: #79c0ff; font-weight: 600; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
    .val { fill: #c9d1d9; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; }
    .separator { stroke: #30363d; stroke-width: 1px; }
    .animate-line { opacity: 0; animation: fadeInSlide 0.4s ease-out forwards; }
    @keyframes fadeInSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
  <rect class="bg" width="490" height="530" rx="8" />

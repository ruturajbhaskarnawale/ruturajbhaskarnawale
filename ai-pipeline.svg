  <rect class="box" x="725" y="60" width="115" height="140" rx="6" />
  <text class="node-title" x="737" y="84" fill="#7ee787">5. Outcome</text>
  <line x1="737" y1="92" x2="828" y2="92" stroke="#30363d" stroke-width="1" />
  <text class="node-sub" x="737" y="112">• [REAL] Authentic</text>
  <text class="node-sub" x="737" y="134">• [FAKE] Deepfake</text>
  <text class="node-sub" x="737" y="156">• Fraud Risk Score</text>
  <line x1="165" y1="130.0" x2="190" y2="130.0" class="flow-line" stroke="#58a6ff" />
  <circle cx="177.5" cy="130.0" class="pulse-dot" />
  <line x1="345" y1="130.0" x2="370" y2="130.0" class="flow-line" stroke="#58a6ff" />
  <circle cx="357.5" cy="130.0" class="pulse-dot" />
  <line x1="535" y1="130.0" x2="560" y2="130.0" class="flow-line" stroke="#58a6ff" />
  <circle cx="547.5" cy="130.0" class="pulse-dot" />
  <line x1="700" y1="130.0" x2="725" y2="130.0" class="flow-line" stroke="#58a6ff" />
  <circle cx="712.5" cy="130.0" class="pulse-dot" />
  <text class="node-sub" x="20" y="242">Latency: &lt;150ms/frame | Real-Time Inference | End-to-End PyTorch &amp; FastAPI Pipeline</text>
</svg>